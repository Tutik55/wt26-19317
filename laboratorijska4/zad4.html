
<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stablo predmeta</title>
    <link rel="stylesheet" href="style4.css">
    <script src="script4.js" defer></script>
</head>
<body>

    <h1>Stablo predmeta</h1>

    <div class="godina">
        <button class="dugme" type="button" data-cilj="prva">
            <span class="znak">+</span> Prva godina
        </button>

        <div id="prva" class="predmeti">
            <p>IM1</p>
            <p>IM2</p>
            <p>OE</p>
            <p>EES</p>
        </div>
    </div>

    <div class="godina">
        <button class="dugme" type="button" data-cilj="druga">
            <span class="znak">+</span> Druga godina
        </button>

        <div id="druga" class="predmeti">
            <p>IM3</p>
            <p>OOP</p>
            <p>Baze podataka</p>
            <p>Računarske mreže</p>
        </div>
    </div>

</body>
</html>
