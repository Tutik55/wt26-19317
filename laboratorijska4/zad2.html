<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrolna lista</title>
    <link rel="stylesheet" href="style2.css">
    <script src="script2.js" defer></script>
</head>
<body>
    <h1>Kreiranje obavijesti</h1>

    <form id="forma">
        <label for="naslov">Naslov obavijesti:</label>
        <input type="text" id="naslov">

        <label for="tekst">Tekst obavijesti:</label>
        <textarea id="tekst"></textarea>

        <label for="kategorija">Kategorija:</label>
        <select id="kategorija">
            <option value="informacija">Informacija</option>
            <option value="upozorenje">Upozorenje</option>
        </select>

        <button type="submit">Prikaži pregled</button>
        <button type="reset">Resetuj formu</button>
    </form>

    <p id="greska" role="alert"></p>

    <h2>Pregled obavijesti</h2>

    <div id="pregled">
        <h3 id="pregledNaslov">Nema obavijesti</h3>
        <p id="pregledTekst">Ovdje će se prikazati tekst obavijesti.</p>
        <p id="pregledKategorija">Kategorija: -</p>
    </div>




</body>
