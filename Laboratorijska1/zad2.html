<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Zivot na Marsu</title>
  </head>
  <body>

  <h1> Prijava za simulaciju zivota na Marsu</h1>

  <p> Dobrodosli u program Mars Simulation.Popunite formu kako biste se prijavili za eksperimentalnu misiju simulaacije zivota na Marsu.</p>

<form>

<label for="ime">Ime i Prezime</label>
<input type="text" id="ime" name="ime"><br>

<label for="godine">Broj godina:</label>
<input type="number" id="godine" name="godine">
<br>

<p> Odaberite svoju ulogu na marsu</p><br>

<input type="radio" id="pilot" name="uloga">
<label for="pilot">Pilot</label><br>

<input type="radio" id="inzenjer" name="uloga">
<label for="inzenjer">Inzenjer</label><br>

<input type="radio" id="biolog" name="uloga">
<label for="biolog">Biolog</label><br>

<input type="radio" id="doktor" name="uloga">
<label for="doktor">Doktor</label>


<p>Koje vještine posjedujete?</p>

<input type="checkbox" id="programiranje" name="vjestine">
<label for="programiranje">Programiranje</label><br>

<input type="checkbox" id="medicina" name="vjestine">
<label for="medicina">Medicina</label><br>

<input type="checkbox" id="mehanika" name="vjestine">
<label for="mehanika">Mehanika</label><br>

<input type="checkbox" id="botanika" name="vjestine">
<label for="botanika">Botanika</label><br><br><br>

<label for="trajanje">Odaberite trajanje simulacije:</label>

<select id="trajanje" name="trajanje">
<option value="7">7 dana</option>
<option value="14">14 dana</option>
<option value="30">30 dana</option>
<option value="60">60 dana</option>
</select>





</form>

  </body>
</html>
